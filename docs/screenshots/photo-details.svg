<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
  <title id="title">Fullscreen photo viewer with EXIF details</title>
  <desc id="description">An illustrative mountain lake photo beside its camera, lens, exposure, and image dimensions.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#161b22"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#7089a9"/>
      <stop offset=".58" stop-color="#e1a987"/>
      <stop offset="1" stop-color="#f3d9aa"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#668c9b"/>
      <stop offset="1" stop-color="#263f54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="photo">
      <rect x="54" y="77" width="640" height="427" rx="8"/>
    </clipPath>
  </defs>
  <rect width="1000" height="600" fill="url(#background)"/>
  <rect x="54" y="77" width="640" height="427" rx="8" fill="#202c39" filter="url(#shadow)"/>
  <g clip-path="url(#photo)">
    <rect x="54" y="77" width="640" height="427" fill="url(#sky)"/>
    <circle cx="488" cy="197" r="49" fill="#ffe1ad" opacity=".9"/>
    <path d="M54 343 160 202l86 111 111-151 142 184 111-143 84 135v166H54Z" fill="#596d77"/>
    <path d="m54 362 118-99 94 99 97-111 140 138 107-102 130 102v115H54Z" fill="#334d59"/>
    <path d="M54 355q160-18 320 5t320-7v151H54Z" fill="url(#water)"/>
    <path d="M54 382q160-17 320 5t320-8M82 431q133-13 257 4t267-7" fill="none" stroke="#c1d0ca" stroke-width="3" opacity=".5"/>
    <path d="m54 330 53-61 43 50 42-82 57 98v44H54Zm468 27 54-75 41 54 43-61 82 92v40H522Z" fill="#263e48"/>
    <path d="M354 359h50v4h-50zm-152 29h120v3H202zm250 31h150v4H452z" fill="#f3d9bd" opacity=".5"/>
  </g>
  <rect x="722" y="92" width="226" height="410" rx="12" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <text x="746" y="125" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="17" font-weight="650">Photo details</text>
  <g font-family="system-ui, sans-serif">
    <g fill="#8b949e" font-size="11">
      <text x="746" y="161">Date</text>
      <text x="746" y="207">Camera</text>
      <text x="746" y="253">Lens</text>
      <text x="746" y="299">Aperture</text>
      <text x="746" y="345">Exposure</text>
      <text x="746" y="391">ISO</text>
      <text x="746" y="437">Dimensions</text>
    </g>
    <g fill="#e6edf3" font-size="13">
      <text x="746" y="180">Sep 14, 2025, 6:42 PM</text>
      <text x="746" y="226">Canon EOS R6</text>
      <text x="746" y="272">RF 35mm F1.8 MACRO IS STM</text>
      <text x="746" y="318">f/2.8</text>
      <text x="746" y="364">1/250 s</text>
      <text x="746" y="410">100</text>
      <text x="746" y="456">6000 × 4000</text>
    </g>
  </g>
  <g fill="#e6edf3" opacity=".8">
    <circle cx="28" cy="292" r="19" fill="#161b22" stroke="#30363d"/>
    <path d="m31 283-9 9 9 9" fill="none" stroke="#c9d1d9" stroke-width="2"/>
    <circle cx="972" cy="292" r="19" fill="#161b22" stroke="#30363d"/>
    <path d="m969 283 9 9-9 9" fill="none" stroke="#c9d1d9" stroke-width="2"/>
  </g>
  <circle cx="960" cy="32" r="17" fill="#161b22" stroke="#30363d"/>
  <path d="m954 26 12 12m0-12-12 12" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="500" y="559" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13">1 / 1</text>
</svg>
